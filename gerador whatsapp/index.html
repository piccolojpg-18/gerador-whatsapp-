<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Maju Promo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f0f2f5; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #ff4757; }
        textarea { width: 100%; height: 200px; border-radius: 12px; padding: 15px; box-sizing: border-box; border: 2px solid #eee; outline: none; }
        .buttons { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-gerar { background: #ff4757; color: white; }
        .btn-copiar { background: #2f3542; color: white; display: none; }
        #resultado { background: #f9f9f9; padding: 20px; border-radius: 12px; margin-top: 25px; white-space: pre-wrap; border: 2px dashed #cbd5e0; }
    </style>
</head>
<body>
<div class="container">
    <h2>🛍️ Gerador Maju Promo</h2>
    <textarea id="entrada" placeholder="Cole a mensagem original completa aqui..."></textarea>
    <div class="buttons">
        <button class="btn-gerar" onclick="gerarOferta()">Gerar Oferta 🚀</button>
        <button id="btnCopiar" class="btn-copiar" onclick="copiarTexto()">Copiar 📋</button>
    </div>
    <div id="resultado">O resultado aparecerá aqui...</div>
</div>

<script>
    const gatilhos = [
        "🔥 CORRA! Restam pouquíssimas unidades!",
        "⏳ OFERTA POR TEMPO LIMITADO!",
        "😱 O menor preço que eu já vi nesse produto!",
        "🚀 ESTOQUE VOANDO! Garanta o seu agora.",
        "🎁 Um presentão por um preço de lembrancinha!",
        "🚨 ALERTA: Menor preço histórico!",
        "🤯 INACREDITÁVEL! Esse valor é real.",
        "💥 SURREAL! Nunca vi tão barato."
    ];

    function gerarOferta() {
        let textoOriginal = document.getElementById('entrada').value;
        if (!textoOriginal) return alert("Cole o texto!");

        const matchPor = textoOriginal.match(/(?:por|Por)\s*R?\$\s*([\d.,]+)/i);
        if (!matchPor) return alert("Preço 'por' não encontrado!");

        let valorAtual = parseFloat(matchPor[1].replace(/\./g, '').replace(',', '.'));
        const matchDe = textoOriginal.match(/(?:de|De)\s*R?\$\s*([\d.,]+)/i);
        
        let valorDe = matchDe ? 
            parseFloat(matchDe[1].replace(/\./g, '').replace(',', '.')) : 
            valorAtual * (1.4 + Math.random() * 0.2);

        let porcentagem = Math.round(((valorDe - valorAtual) / valorDe) * 100);
        const formatar = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        const gatilho = gatilhos[Math.floor(Math.random() * gatilhos.length)];
        const cabecalho = `${gatilho}\n✨ ${porcentagem}% de desconto!\n\n`;
        const precoDe = `~de ${formatar(valorDe)}~\n`;

        let resultadoFinal = textoOriginal.replace(matchPor[0], `${precoDe}${matchPor[0]}`);
        resultadoFinal = cabecalho + resultadoFinal;

        document.getElementById('resultado').innerText = resultadoFinal;
        document.getElementById('btnCopiar').style.display = 'block';
    }

    function copiarTexto() {
        const texto = document.getElementById('resultado').innerText;
        navigator.clipboard.writeText(texto);
        alert("Copiado!");
    }
</script>
</body>
</html>
